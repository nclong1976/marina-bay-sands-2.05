services:
  - type: web
    name: sands-club
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # Tên miền riêng — Render chỉ cấp HTTPS sau khi DNS đã trỏ về service (xem DEPLOYMENT.md mục 3)
    domains:
      - sandsm8v6club.com
      - www.sandsm8v6club.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
